<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Correa Asesoría - FinanzasPro v5</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #0f172a; color: #f1f5f9; }
        .glass { background: rgba(30, 41, 59, 0.7); backdrop-filter: blur(12px); border: 1px solid rgba(255,255,255,0.1); }
        .gradient-text { background: linear-gradient(90deg, #4ade80, #22d3ee); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .bar-grow { transition: width 1s ease-in-out; }
    </style>
</head>
<body class="pb-10">

    <div id="auth-section" class="min-h-screen flex items-center justify-center p-6">
        <div class="glass w-full max-w-md p-8 rounded-[2.5rem] text-center">
            <h1 class="text-3xl font-extrabold gradient-text mb-6">FinanzasPro</h1>
            <input id="email" type="email" placeholder="Email" class="w-full p-4 mb-4 rounded-xl bg-slate-900 border border-slate-700 outline-none">
            <input id="password" type="password" placeholder="Password" class="w-full p-4 mb-6 rounded-xl bg-slate-900 border border-slate-700 outline-none">
            <button onclick="login()" class="w-full bg-emerald-500 p-4 rounded-xl font-bold">Entrar</button>
        </div>
    </div>

    <div id="main-app" class="hidden max-w-md mx-auto p-6 space-y-6">
        
        <div class="text-center py-4">
            <p class="text-xs font-bold text-slate-500 uppercase tracking-widest">Patrimonio Neto</p>
            <h1 id="patrimonio-neto" class="text-4xl font-black text-white">$0</h1>
        </div>

        <div class="glass p-6 rounded-[2rem] space-y-4">
            <h3 class="text-xs font-bold text-slate-400 uppercase">Análisis de Flujo</h3>
            <div class="space-y-2">
                <div class="flex justify-between text-[10px] font-bold text-emerald-400"><span>INGRESOS</span> <span id="val-ingreso">$0</span></div>
                <div class="w-full bg-slate-800 h-2 rounded-full overflow-hidden"><div id="bar-ingreso" class="bar-grow bg-emerald-500 h-full w-0"></div></div>
                
                <div class="flex justify-between text-[10px] font-bold text-rose-400"><span>GASTOS</span> <span id="val-gasto">$0</span></div>
                <div class="w-full bg-slate-800 h-2 rounded-full overflow-hidden"><div id="bar-gasto" class="bar-grow bg-rose-500 h-full w-0"></div></div>
                
                <div class="flex justify-between text-[10px] font-bold text-cyan-400"><span>DEUDA ACTIVA</span> <span id="val-deuda">$0</span></div>
                <div class="w-full bg-slate-800 h-2 rounded-full overflow-hidden"><div id="bar-deuda" class="bar-grow bg-cyan-500 h-full w-0"></div></div>
            </div>
        </div>

        <section class="glass p-6 rounded-[2.5rem]">
            <div class="space-y-3">
                <input id="m-concepto" type="text" placeholder="Concepto (Ej: Seguro Auto)" class="w-full p-4 rounded-xl bg-slate-900 border border-slate-700">
                <div class="grid grid-cols-2 gap-3">
                    <input id="m-monto" type="number" placeholder="Monto $" class="p-4 rounded-xl bg-slate-900 border border-slate-700">
                    <select id="m-tipo" class="p-4 rounded-xl bg-slate-900 border border-slate-700 font-bold">
                        <option value="ingreso">🟢 Ingreso</option>
                        <option value="gasto">🔴 Gasto</option>
                        <option value="inversion">🔵 Inversión</option>
                        <option value="deuda">🟠 Deuda</option>
                    </select>
                </div>
                <select id="m-cuenta" class="w-full p-4 rounded-xl bg-slate-900 border border-slate-700 italic text-slate-400">
                    <option value="efectivo">💵 Efectivo / Cash</option>
                </select>
                
                <div id="msi-container" class="hidden flex items-center justify-between p-2 bg-slate-800/50 rounded-xl">
                    <span class="text-[10px] text-slate-400 font-bold uppercase">Plan MSI</span>
                    <select id="m-msi" class="p-2 rounded-lg bg-slate-900 border border-slate-700 text-xs">
                        <option value="1">Contado</option>
                        <option value="3">3 meses</option>
                        <option value="6">6 meses</option>
                        <option value="12">12 meses</option>
                    </select>
                </div>
                <button onclick="guardarMovimiento()" class="w-full bg-emerald-500 p-4 rounded-2xl font-black uppercase text-sm shadow-lg">Registrar</button>
            </div>
        </section>

        <details class="glass p-4 rounded-2xl">
            <summary class="text-xs font-bold text-slate-400 cursor-pointer uppercase">💳 Gestionar Tarjetas</summary>
            <div class="mt-4 space-y-2">
                <input id="acc-name" type="text" placeholder="Nombre Banco" class="w-full p-3 rounded-lg bg-slate-900 border border-slate-700 text-xs">
                <select id="acc-type" class="w-full p-3 rounded-lg bg-slate-900 border border-slate-700 text-xs">
                    <option value="debito">Débito</option>
                    <option value="credito">Crédito</option>
                </select>
                <button onclick="crearCuenta()" class="w-full bg-slate-700 p-2 rounded-lg text-[10px] font-bold uppercase">Añadir</button>
            </div>
        </details>

        <div id="lista-movimientos" class="space-y-3"></div>
        <button onclick="logout()" class="w-full text-slate-500 text-xs font-bold uppercase py-4">Cerrar Sesión</button>
    </div>

    <script>
        const SUPABASE_URL = 'TU_URL';
        const SUPABASE_KEY = 'TU_KEY';
        const _client = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        // --- CUENTAS ---
        async function cargarCuentas() {
            const { data } = await _client.from('cuentas').select('*');
            const select = document.getElementById('m-cuenta');
            if (data) {
                data.forEach(c => {
                    select.innerHTML += `<option value="${c.id}">${c.tipo === 'credito' ? '💳' : '🏦'} ${c.nombre_institucion}</option>`;
                });
            }
        }

        async function crearCuenta() {
            const { data: { user } } = await _client.auth.getUser();
            await _client.from('cuentas').insert([{ 
                nombre_institucion: document.getElementById('acc-name').value, 
                tipo: document.getElementById('acc-type').value,
                user_id: user.id 
            }]);
            location.reload();
        }

        // --- MOVIMIENTOS ---
        async function guardarMovimiento() {
            const { data: { user } } = await _client.auth.getUser();
            const payload = {
                concepto: document.getElementById('m-concepto').value,
                monto: document.getElementById('m-monto').value,
                tipo: document.getElementById('m-tipo').value,
                cuenta_id: document.getElementById('m-cuenta').value === 'efectivo' ? null : document.getElementById('m-cuenta').value,
                msi: document.getElementById('m-msi').value,
                user_id: user.id
            };
            await _client.from('movimientos').insert([payload]);
            location.reload();
        }

        async function mostrarTodo() {
            const { data: movs } = await _client.from('movimientos').select('*').order('created_at', {ascending: false});
            const { data: accs } = await _client.from('cuentas').select('*');
            
            let tIngreso = 0, tGasto = 0, tDeuda = 0, tInversion = 0;
            const lista = document.getElementById('lista-movimientos');
            
            movs.forEach(m => {
                const monto = parseFloat(m.monto);
                const cuotaMensual = monto / (m.msi || 1);
                
                if(m.tipo === 'ingreso') tIngreso += monto;
                if(m.tipo === 'gasto') tGasto += monto;
                if(m.tipo === 'deuda') tDeuda += monto;
                if(m.tipo === 'inversion') tInversion += monto;

                lista.innerHTML += `
                    <div class="glass p-4 rounded-2xl flex justify-between items-center border-l-4 ${m.tipo === 'ingreso' ? 'border-emerald-500' : 'border-rose-500'}">
                        <div>
                            <p class="font-bold text-sm">${m.concepto}</p>
                            <p class="text-[10px] text-slate-500 font-bold uppercase">${m.msi > 1 ? `Pago 1/${m.msi} de $${cuotaMensual.toFixed(0)}` : m.tipo}</p>
                        </div>
                        <p class="font-black ${m.tipo === 'ingreso' ? 'text-emerald-400' : 'text-rose-400'}">${m.tipo === 'ingreso' ? '+' : '-'}$${monto.toLocaleString()}</p>
                    </div>`;
            });

            // Actualizar Gráficas
            const max = Math.max(tIngreso, tGasto, tDeuda) || 1;
            document.getElementById('bar-ingreso').style.width = (tIngreso/max*100) + '%';
            document.getElementById('bar-gasto').style.width = (tGasto/max*100) + '%';
            document.getElementById('bar-deuda').style.width = (tDeuda/max*100) + '%';
            
            document.getElementById('val-ingreso').innerText = `$${tIngreso.toLocaleString()}`;
            document.getElementById('val-gasto').innerText = `$${tGasto.toLocaleString()}`;
            document.getElementById('val-deuda').innerText = `$${tDeuda.toLocaleString()}`;
            document.getElementById('patrimonio-neto').innerText = `$${(tIngreso + tInversion - tGasto - tDeuda).toLocaleString()}`;
        }

        // --- AUTH ---
        async function login() { 
            const { error } = await _client.auth.signInWithPassword({ email: email.value, password: password.value });
            if(error) alert(error.message); else check();
        }
        async function logout() { await _client.auth.signOut(); location.reload(); }
        async function check() {
            const { data: { user } } = await _client.auth.getUser();
            if(user) {
                document.getElementById('auth-section').classList.add('hidden');
                document.getElementById('main-app').classList.remove('hidden');
                cargarCuentas(); mostrarTodo();
            }
        }
        check();

        // Mostrar MSI si la cuenta es crédito
        document.getElementById('m-cuenta').addEventListener('change', async function() {
            const val = this.value;
            if(val === 'efectivo') {
                document.getElementById('msi-container').classList.add('hidden');
                return;
            }
            const { data } = await _client.from('cuentas').select('tipo').eq('id', val).single();
            if(data && data.tipo === 'credito') document.getElementById('msi-container').classList.remove('hidden');
            else document.getElementById('msi-container').classList.add('hidden');
        });
    </script>
</body>
</html>
