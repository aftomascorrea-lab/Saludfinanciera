<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FinanzasPro V2</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-white p-5">
    <div class="max-w-md mx-auto bg-slate-800 p-6 rounded-xl shadow-2xl border border-slate-700">
        <h1 class="text-2xl font-bold text-green-400 mb-4">FinanzasPro</h1>
        
        <div class="space-y-4">
            <input id="desc" type="text" placeholder="Concepto" class="w-full p-3 rounded bg-slate-700 border-none text-white">
            <input id="val" type="number" placeholder="Monto $" class="w-full p-3 rounded bg-slate-700 border-none text-white">
            <button onclick="guardar()" class="w-full bg-green-600 hover:bg-green-500 p-3 rounded font-bold transition">Guardar Dato</button>
        </div>

        <div class="mt-8">
            <h2 class="text-lg font-semibold border-b border-slate-700 mb-3">Tus Movimientos</h2>
            <ul id="lista" class="space-y-2"></ul>
            <button onclick="borrarTodo()" class="mt-4 text-xs text-red-400 underline">Borrar todos mis datos</button>
        </div>
    </div>

    <script>
        function mostrar() {
            const datos = JSON.parse(localStorage.getItem('mis_finanzas') || '[]');
            const lista = document.getElementById('lista');
            lista.innerHTML = datos.map(d => `<li class="bg-slate-700 p-2 rounded flex justify-between"><span>${d.desc}</span><span class="font-mono text-green-400">$${d.val}</span></li>`).join('');
        }

        function guardar() {
            const desc = document.getElementById('desc').value;
            const val = document.getElementById('val').value;
            if(!desc || !val) return alert('¡Escribe algo!');
            
            const datos = JSON.parse(localStorage.getItem('mis_finanzas') || '[]');
            datos.push({desc, val});
            localStorage.setItem('mis_finanzas', JSON.stringify(datos));
            
            document.getElementById('desc').value = '';
            document.getElementById('val').value = '';
            mostrar();
        }

        function borrarTodo() {
            if(confirm('¿Seguro? Se borrarán TUS datos en este dispositivo.')) {
                localStorage.removeItem('mis_finanzas');
                mostrar();
            }
        }

        mostrar();
    </script>
</body>
</html>
