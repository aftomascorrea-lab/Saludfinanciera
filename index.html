<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Correa Asesoría - FinanzasPro</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #0f172a; color: #f1f5f9; }
        .glass { background: rgba(30, 41, 59, 0.7); backdrop-filter: blur(12px); border: 1px solid rgba(255,255,255,0.1); }
        .gradient-text { background: linear-gradient(90deg, #4ade80, #22d3ee); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    </style>
</head>
<body class="pb-10">

    <div id="auth-section" class="min-h-screen flex items-center justify-center p-6">
        <div class="glass w-full max-w-md p-8 rounded-[2.5rem] text-center">
            <h1 class="text-3xl font-extrabold gradient-text mb-6">FinanzasPro</h1>
            <input id="email" type="email" placeholder="Email" class="w-full p-4 mb-4 rounded-xl bg-slate-900 border border-slate-700 outline-none">
            <input id="password" type="password" placeholder="Password" class="w-full p-4 mb-6 rounded-xl bg-slate-900 border border-slate-700 outline-none">
            <button onclick="login()" class="w-full bg-emerald-500 p-4 rounded-xl font-bold mb-2">Entrar</button>
            <button onclick="registro()" class="text-slate-400 text-sm">Registrarse</button>
        </div>
    </div>

    <div id="main-app" class="hidden max-w-md mx-auto p-6 space-y-6">
        
        <div class="grid grid-cols-2 gap-4">
            <div class="glass p-5 rounded-3xl text-center">
                <p class="text-[10px] uppercase font-bold text-slate-400 tracking-widest">Efectivo</p>
                <h2 id="total-efectivo" class="text-2xl font-black text-emerald-400">$0</h2>
            </div>
            <div class="glass p-5 rounded-3xl text-center">
                <p class="text-[10px] uppercase font-bold text-slate-400 tracking-widest">Deuda Total</p>
                <h2 id="total-deuda" class="text-2xl font-black text-rose-400">$0</h2>
            </div>
        </div>

        <details class="glass p-5 rounded-3xl">
            <summary class="font-bold text-sm cursor-pointer text-slate-300">💳 Mis Tarjetas / Cuentas</summary>
            <div class="mt-4 space-y-3">
                <input id="acc-name" type="text" placeholder="Banco (Ej: BBVA)" class="w-full p-3 rounded-lg bg-slate-900 border border-slate-700 text-sm">
                <select id="acc-type" class="w-full p-3 rounded-lg bg-slate-900 border border-slate-700 text-sm">
                    <option value="debito">Débito (Efectivo)</option>
                    <option value="credito">Tarjeta de Crédito</option>
                </select>
                <input id="acc-limit" type="number" placeholder="Límite (si es crédito)" class="w-full p-3 rounded-lg bg-slate-900 border border-slate-700 text-sm">
                <button onclick="crearCuenta()" class="w-full bg-slate-700 p-3 rounded-lg text-xs font-bold uppercase tracking-widest">Añadir Tarjeta</button>
                <div id="lista-cuentas" class="pt-2 text-xs text-slate-400 space-y-1"></div>
            </div>
        </details>

        <section class="glass p-6 rounded-[2.5rem]">
            <h3 class="text-sm font-bold text-slate-400 mb-4 uppercase tracking-widest">Nuevo Movimiento</h3>
            <div class="space-y-3">
                <input id="m-concepto" type="text" placeholder="Concepto" class="w-full p-4 rounded-xl bg-slate-900 border border-slate-700">
                <div class="grid grid-cols-2 gap-3">
                    <input id="m-monto" type="number" placeholder="Monto $" class="p-4 rounded-xl bg-slate-900 border border-slate-700">
                    <select id="m-tipo" class="p-4 rounded-xl bg-slate-900 border border-slate-700 font-bold text-emerald-400">
                        <option value="ingreso">🟢 Ingreso</option>
                        <option value="gasto">🔴 Gasto</option>
                        <option value="inversion">🔵 Inversión</option>
                    </select>
                </div>
                <select id="m-cuenta" class="w-full p-4 rounded-xl bg-slate-900 border border-slate-700">
                    <option value="">Selecciona una tarjeta...</option>
                </select>
                <div id="msi-container" class="hidden flex items-center justify-between p-2">
                    <span class="text-xs text-slate-400 font-bold">¿MESES SIN INT?</span>
                    <select id="m-msi" class="p-2 rounded-lg bg-slate-800 border border-slate-700 text-xs">
                        <option value="0">Un solo pago</option>
                        <option value="3">3 Meses</option>
                        <option value="6">6 Meses</option>
                        <option value="12">12 Meses</option>
                    </select>
                </div>
                <button onclick="guardarMovimiento()" class="w-full bg-emerald-500 p-4 rounded-2xl font-black uppercase text-sm tracking-widest shadow-lg shadow-emerald-900/20">Registrar</button>
            </div>
        </section>

        <div id="lista-movimientos" class="space-y-3"></div>
        <button onclick="logout()" class="w-full text-slate-500 py-10 text-xs font-bold uppercase tracking-widest">Cerrar Sesión</button>
    </div>

    <script>
        const SUPABASE_URL = 'https://pibnwghhrnavyzjunkly.supabase.co';
        const SUPABASE_KEY = 'sb_publishable_SlpV8t9zWObDOW6IpVIuDQ_DR3IhD9v';
        const _client = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        // --- LÓGICA DE TARJETAS ---
        async function crearCuenta() {
            const { data: { user } } = await _client.auth.getUser();
            const nombre = document.getElementById('acc-name').value;
            const tipo = document.getElementById('acc-type').value;
            const limite = document.getElementById('acc-limit').value || 0;

            await _client.from('cuentas').insert([{ 
                nombre_institucion: nombre, 
                tipo, 
                limite_credito: limite,
                user_id: user.id 
            }]);
            location.reload();
        }

        async function cargarCuentas() {
            const { data } = await _client.from('cuentas').select('*');
            const select = document.getElementById('m-cuenta');
            const lista = document.getElementById('lista-cuentas');
            if (data) {
                data.forEach(c => {
                    select.innerHTML += `<option value="${c.id}">${c.nombre_institucion} (${c.tipo})</option>`;
                    lista.innerHTML += `<div>• ${c.nombre_institucion} - ${c.tipo.toUpperCase()}</div>`;
                });
            }
        }

        // --- LÓGICA DE MOVIMIENTOS ---
        async function guardarMovimiento() {
            const { data: { user } } = await _client.auth.getUser();
            const concepto = document.getElementById('m-concepto').value;
            const monto = document.getElementById('m-monto').value;
            const tipo = document.getElementById('m-tipo').value;
            const cuenta = document.getElementById('m-cuenta').value;
            const msi = document.getElementById('m-msi').value;

            await _client.from('movimientos').insert([{
                concepto, monto, tipo, cuenta_id: cuenta, msi, user_id: user.id
            }]);
            location.reload();
        }

        async function mostrarTodo() {
            const { data: movs } = await _client.from('movimientos').select('*').order('created_at', {ascending: false});
            const { data: accs } = await _client.from('cuentas').select('*');
            
            let cash = 0; let debt = 0;
            const lista = document.getElementById('lista-movimientos');
            
            movs.forEach(m => {
                const esEntrada = m.tipo === 'ingreso';
                const esInversion = m.tipo === 'inversion';
                
                // Lógica contable:
                if(esEntrada) cash += parseFloat(m.monto);
                else if(m.tipo === 'gasto' || m.tipo === 'deuda') {
                    // Si el movimiento tiene una cuenta de crédito, aumenta la deuda
                    const cuentaRel = accs.find(a => a.id === m.cuenta_id);
                    if(cuentaRel && cuentaRel.tipo === 'credito') debt += parseFloat(m.monto);
                    else cash -= parseFloat(m.monto);
                }
                
                lista.innerHTML += `
                    <div class="glass p-4 rounded-2xl flex justify-between items-center border-l-4 ${esEntrada ? 'border-emerald-500' : 'border-rose-500'}">
                        <div><p class="font-bold text-sm">${m.concepto}</p><p class="text-[10px] text-slate-500 font-bold uppercase">${m.tipo}</p></div>
                        <p class="font-black ${esEntrada ? 'text-emerald-400' : 'text-rose-400'}">${esEntrada ? '+' : '-'}$${m.monto}</p>
                    </div>`;
            });
            
            document.getElementById('total-efectivo').innerText = `$${cash.toLocaleString()}`;
            document.getElementById('total-deuda').innerText = `$${debt.toLocaleString()}`;
        }

        // --- SISTEMA ---
        async function login() { 
            const { error } = await _client.auth.signInWithPassword({ email: email.value, password: password.value });
            if(error) alert(error.message); else check();
        }
        async function registro() { 
            const { error } = await _client.auth.signUp({ email: email.value, password: password.value });
            alert(error ? error.message : "Revisa tu email!");
        }
        async function logout() { await _client.auth.signOut(); check(); }
        async function check() {
            const { data: { user } } = await _client.auth.getUser();
            if(user) {
                document.getElementById('auth-section').classList.add('hidden');
                document.getElementById('main-app').classList.remove('hidden');
                cargarCuentas(); mostrarTodo();
            }
        }
        check();

        // Mostrar MSI si la cuenta elegida es crédito
        document.getElementById('m-cuenta').addEventListener('change', async function() {
            const { data } = await _client.from('cuentas').select('tipo').eq('id', this.value).single();
            if(data && data.tipo === 'credito') document.getElementById('msi-container').classList.remove('hidden');
            else document.getElementById('msi-container').classList.add('hidden');
        });
    </script>
</body>
</html>
