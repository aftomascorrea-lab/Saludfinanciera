<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FinanzasPro - Correa Asesoría</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #0f172a; color: #f1f5f9; overflow-x: hidden; }
        .glass { background: rgba(30, 41, 59, 0.7); backdrop-filter: blur(12px); border: 1px solid rgba(255,255,255,0.1); }
        .gradient-text { background: linear-gradient(90deg, #4ade80, #22d3ee); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .nav-btn { transition: all 0.3s; opacity: 0.6; }
        .nav-btn.active { opacity: 1; border-bottom: 2px solid #10b981; color: #10b981; }
        .view { display: none; }
        .view.active { display: block; }
    </style>
</head>
<body class="pb-24">

    <div id="auth-section" class="min-h-screen flex items-center justify-center p-6">
        <div class="glass w-full max-w-md p-8 rounded-[2.5rem] text-center">
            <h1 class="text-3xl font-extrabold gradient-text mb-6 tracking-tighter">FinanzasPro</h1>
            <input id="email" type="email" placeholder="Email" class="w-full p-4 mb-4 rounded-xl bg-slate-900 border border-slate-700 outline-none">
            <input id="password" type="password" placeholder="Password" class="w-full p-4 mb-6 rounded-xl bg-slate-900 border border-slate-700 outline-none">
            <button onclick="login()" class="w-full bg-emerald-500 p-4 rounded-xl font-bold hover:bg-emerald-600">Entrar</button>
        </div>
    </div>

    <div id="main-app" class="hidden max-w-md mx-auto p-6">
        
        <header class="flex justify-between items-center mb-8">
            <div>
                <p class="text-[10px] font-bold text-slate-500 uppercase tracking-widest">Patrimonio Neto</p>
                <h1 id="patrimonio-neto" class="text-3xl font-black">$0</h1>
            </div>
            <button onclick="logout()" class="p-2 glass rounded-lg text-[10px] font-bold text-rose-400">SALIR</button>
        </header>

        <main id="view-dashboard" class="view active space-y-6">
            <div class="glass p-6 rounded-[2.5rem] space-y-4">
                <h3 class="text-xs font-bold text-slate-400 uppercase tracking-wider">Flujo de Fondos</h3>
                <div class="space-y-3">
                    <div class="space-y-1">
                        <div class="flex justify-between text-[10px] font-bold text-emerald-400"><span>INGRESOS</span> <span id="val-ingreso">$0</span></div>
                        <div class="w-full bg-slate-800 h-1.5 rounded-full"><div id="bar-ingreso" class="bg-emerald-500 h-full w-0 rounded-full transition-all duration-1000"></div></div>
                    </div>
                    <div class="space-y-1">
                        <div class="flex justify-between text-[10px] font-bold text-rose-400"><span>GASTOS</span> <span id="val-gasto">$0</span></div>
                        <div class="w-full bg-slate-800 h-1.5 rounded-full"><div id="bar-gasto" class="bg-rose-500 h-full w-0 rounded-full transition-all duration-1000"></div></div>
                    </div>
                    <div class="space-y-1">
                        <div class="flex justify-between text-[10px] font-bold text-cyan-400"><span>INVERSIONES</span> <span id="val-inversion">$0</span></div>
                        <div class="w-full bg-slate-800 h-1.5 rounded-full"><div id="bar-inversion" class="bg-cyan-500 h-full w-0 rounded-full transition-all duration-1000"></div></div>
                    </div>
                    <div class="space-y-1">
                        <div class="flex justify-between text-[10px] font-bold text-orange-400"><span>DEUDA ACTIVA</span> <span id="val-deuda">$0</span></div>
                        <div class="w-full bg-slate-800 h-1.5 rounded-full"><div id="bar-deuda" class="bg-orange-500 h-full w-0 rounded-full transition-all duration-1000"></div></div>
                    </div>
                </div>
            </div>

            <section class="glass p-6 rounded-[2.5rem] space-y-4">
                <h3 class="text-xs font-bold text-slate-400 uppercase tracking-wider">Nuevo Registro</h3>
                <div class="space-y-3">
                    <input id="m-concepto" type="text" placeholder="Concepto" class="w-full p-4 rounded-xl bg-slate-900 border border-slate-700 outline-none text-sm">
                    <div class="grid grid-cols-2 gap-3">
                        <input id="m-monto" type="number" placeholder="Monto $" class="p-4 rounded-xl bg-slate-900 border border-slate-700 outline-none text-sm font-bold">
                        <select id="m-tipo" class="p-4 rounded-xl bg-slate-900 border border-slate-700 font-bold text-sm">
                            <option value="ingreso">🟢 Ingreso</option>
                            <option value="gasto">🔴 Gasto</option>
                            <option value="inversion">🔵 Inversión</option>
                            <option value="deuda">🟠 Deuda</option>
                        </select>
                    </div>
                    <select id="m-cuenta" class="w-full p-4 rounded-xl bg-slate-900 border border-slate-700 text-sm italic">
                        <option value="efectivo">💵 Efectivo / Cash</option>
                    </select>
                    <select id="m-categoria" class="w-full p-4 rounded-xl bg-slate-900 border border-slate-700 text-sm">
                        <option value="general">📁 Categoría: General</option>
                    </select>
                    <button onclick="guardarMovimiento()" class="w-full bg-emerald-500 p-4 rounded-2xl font-black uppercase text-sm shadow-lg hover:bg-emerald-400 transition-colors">Registrar</button>
                </div>
            </section>
        </main>

        <main id="view-movimientos" class="view space-y-4">
            <h2 class="text-xl font-bold px-2">Historial Completo</h2>
            <div id="lista-movimientos" class="space-y-3"></div>
        </main>

        <main id="view-config" class="view space-y-6">
            <h2 class="text-xl font-bold px-2">Configuración</h2>
            
            <div class="glass p-5 rounded-2xl space-y-3">
                <h3 class="text-xs font-bold text-slate-400 uppercase">Añadir Categoría</h3>
                <div class="flex gap-2">
                    <input id="cat-name" type="text" placeholder="Ej: Comida, Auto..." class="flex-1 p-3 rounded-lg bg-slate-900 border border-slate-700 text-sm">
                    <button onclick="crearCategoria()" class="bg-emerald-500 px-4 rounded-lg font-bold">+</button>
                </div>
                <div id="lista-categorias" class="flex flex-wrap gap-2 pt-2"></div>
            </div>

            <div class="glass p-5 rounded-2xl space-y-3">
                <h3 class="text-xs font-bold text-slate-400 uppercase">Tarjetas / Cuentas</h3>
                <div class="space-y-2">
                    <input id="acc-name" type="text" placeholder="Nombre Banco" class="w-full p-3 rounded-lg bg-slate-900 border border-slate-700 text-xs">
                    <select id="acc-type" class="w-full p-3 rounded-lg bg-slate-900 border border-slate-700 text-xs font-bold">
                        <option value="debito">Débito</option>
                        <option value="credito">Crédito</option>
                    </select>
                    <button onclick="crearCuenta()" class="w-full bg-slate-700 p-2 rounded-lg text-[10px] font-bold uppercase">Añadir Tarjeta</button>
                </div>
            </div>
        </main>

        <nav class="fixed bottom-0 left-0 right-0 glass border-t border-white/10 px-6 py-4 flex justify-between items-center max-w-md mx-auto rounded-t-[2rem] z-50">
            <button onclick="switchView('dashboard')" id="nav-dashboard" class="nav-btn active flex flex-col items-center">
                <span class="text-lg text-emerald-400">🏠</span>
                <span class="text-[9px] font-bold uppercase">Home</span>
            </button>
            <button onclick="switchView('movimientos')" id="nav-movimientos" class="nav-btn flex flex-col items-center">
                <span class="text-lg">📜</span>
                <span class="text-[9px] font-bold uppercase">Historial</span>
            </button>
            <button onclick="switchView('config')" id="nav-config" class="nav-btn flex flex-col items-center">
                <span class="text-lg text-slate-400">⚙️</span>
                <span class="text-[9px] font-bold uppercase">Ajustes</span>
            </button>
        </nav>
    </div>

    <script>
        // CONFIG SUPABASE
        const SUPABASE_URL = 'https://pibnwghhrnavyzjunkly.supabase.co';
        const SUPABASE_KEY = 'sb_publishable_SlpV8t9zWObDOW6IpVIuDQ_DR3IhD9v';
        const _client = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        // --- NAVEGACIÓN ---
        function switchView(viewId) {
            document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
            document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
            document.getElementById('view-' + viewId).classList.add('active');
            document.getElementById('nav-' + viewId).classList.add('active');
        }

        // --- CARGAS INICIALES ---
        async function cargarTodo() {
            const { data: { user } } = await _client.auth.getUser();
            if(!user) return;

            // 1. Cargar Tarjetas
            const { data: accs } = await _client.from('cuentas').select('*');
            const selectCuenta = document.getElementById('m-cuenta');
            selectCuenta.innerHTML = '<option value="efectivo">💵 Efectivo / Cash</option>';
            accs?.forEach(c => {
                selectCuenta.innerHTML += `<option value="${c.id}">${c.tipo === 'credito' ? '💳' : '🏦'} ${c.nombre_institucion}</option>`;
            });

            // 2. Cargar Categorías
            const { data: cats } = await _client.from('categorias').select('*');
            const selectCat = document.getElementById('m-categoria');
            const listaCat = document.getElementById('lista-categorias');
            selectCat.innerHTML = '<option value="general">📁 Categoría: General</option>';
            listaCat.innerHTML = '';
            cats?.forEach(cat => {
                selectCat.innerHTML += `<option value="${cat.nombre}">${cat.nombre}</option>`;
                listaCat.innerHTML += `<span class="px-3 py-1 bg-slate-800 rounded-full text-[10px] border border-slate-700">${cat.nombre}</span>`;
            });

            // 3. Movimientos y Gráfica
            const { data: movs } = await _client.from('movimientos').select('*').order('created_at', {ascending: false});
            let ti = 0, tg = 0, td = 0, tinv = 0;
            const listaM = document.getElementById('lista-movimientos');
            listaM.innerHTML = '';

            movs?.forEach(m => {
                const val = parseFloat(m.monto);
                if(m.tipo === 'ingreso') ti += val;
                if(m.tipo === 'gasto') tg += val;
                if(m.tipo === 'deuda') td += val;
                if(m.tipo === 'inversion') tinv += val;

                listaM.innerHTML += `
                    <div class="glass p-4 rounded-2xl flex justify-between items-center border-l-4 ${m.tipo === 'ingreso' ? 'border-emerald-500' : 'border-rose-500'}">
                        <div>
                            <p class="font-bold text-sm">${m.concepto}</p>
                            <p class="text-[9px] text-slate-500 font-black uppercase tracking-tighter">${m.categoria || 'GENERAL'} • ${m.tipo}</p>
                        </div>
                        <div class="text-right">
                            <p class="font-black text-sm ${m.tipo === 'ingreso' ? 'text-emerald-400' : 'text-rose-400'}">${m.tipo === 'ingreso' ? '+' : '-'}$${val.toLocaleString()}</p>
                            <button onclick="eliminarMovimiento('${m.id}')" class="text-[8px] text-rose-800 font-bold hover:text-rose-500">BORRAR</button>
                        </div>
                    </div>`;
            });

            // Actualizar UI
            const max = Math.max(ti, tg, td, tinv) || 1;
            document.getElementById('bar-ingreso').style.width = (ti/max*100) + '%';
            document.getElementById('bar-gasto').style.width = (tg/max*100) + '%';
            document.getElementById('bar-inversion').style.width = (tinv/max*100) + '%';
            document.getElementById('bar-deuda').style.width = (td/max*100) + '%';
            
            document.getElementById('val-ingreso').innerText = `$${ti.toLocaleString()}`;
            document.getElementById('val-gasto').innerText = `$${tg.toLocaleString()}`;
            document.getElementById('val-inversion').innerText = `$${tinv.toLocaleString()}`;
            document.getElementById('val-deuda').innerText = `$${td.toLocaleString()}`;
            document.getElementById('patrimonio-neto').innerText = `$${(ti + tinv - tg - td).toLocaleString()}`;
        }

        // --- ACCIONES ---
        async function guardarMovimiento() {
            const { data: { user } } = await _client.auth.getUser();
            await _client.from('movimientos').insert([{
                concepto: document.getElementById('m-concepto').value,
                monto: document.getElementById('m-monto').value,
                tipo: document.getElementById('m-tipo').value,
                cuenta_id: document.getElementById('m-cuenta').value === 'efectivo' ? null : document.getElementById('m-cuenta').value,
                categoria: document.getElementById('m-categoria').value,
                user_id: user.id
            }]);
            cargarTodo();
            document.getElementById('m-concepto').value = '';
            document.getElementById('m-monto').value = '';
        }

        async function crearCategoria() {
            const { data: { user } } = await _client.auth.getUser();
            await _client.from('categorias').insert([{ nombre: document.getElementById('cat-name').value, user_id: user.id }]);
            document.getElementById('cat-name').value = '';
            cargarTodo();
        }

        async function eliminarMovimiento(id) {
            if(confirm('¿Seguro que quieres borrar este registro?')) {
                await _client.from('movimientos').delete().eq('id', id);
                cargarTodo();
            }
        }

        async function crearCuenta() {
            const { data: { user } } = await _client.auth.getUser();
            await _client.from('cuentas').insert([{ 
                nombre_institucion: document.getElementById('acc-name').value, 
                tipo: document.getElementById('acc-type').value,
                user_id: user.id 
            }]);
            cargarTodo();
        }

        // --- AUTH ---
        async function login() { 
            const { error } = await _client.auth.signInWithPassword({ email: email.value, password: password.value });
            if(error) alert("Error: " + error.message); else check();
        }
        async function logout() { await _client.auth.signOut(); location.reload(); }
        async function check() {
            const { data: { user } } = await _client.auth.getUser();
            if(user) {
                document.getElementById('auth-section').classList.add('hidden');
                document.getElementById('main-app').classList.remove('hidden');
                cargarTodo();
            }
        }
        check();
    </script>
</body>
</html>
