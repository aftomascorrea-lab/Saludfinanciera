<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FinanzasPro - Panel de Control</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen pb-10">
    <div class="bg-slate-800 p-6 shadow-xl sticky top-0 z-10 border-b border-slate-700">
        <div class="max-w-md mx-auto text-center">
            <h1 class="text-slate-400 uppercase tracking-widest text-xs font-bold mb-1">Patrimonio Neto</h1>
            <div id="balance" class="text-4xl font-black text-green-400">$0.00</div>
        </div>
    </div>

    <div class="max-w-md mx-auto p-4 space-y-6">
        <div class="bg-slate-800 p-5 rounded-2xl border border-slate-700 shadow-lg">
            <div class="grid grid-cols-2 gap-3 mb-4">
                <input id="desc" type="text" placeholder="Concepto (Ej: Seguro Auto)" class="col-span-2 p-3 rounded-xl bg-slate-900 border-none focus:ring-2 focus:ring-green-500">
                <input id="val" type="number" placeholder="Monto $" class="p-3 rounded-xl bg-slate-900 border-none focus:ring-2 focus:ring-green-500">
                <select id="tipo" class="p-3 rounded-xl bg-slate-900 border-none focus:ring-2 focus:ring-green-500 text-slate-400">
                    <option value="ingreso">🟢 Ingreso</option>
                    <option value="gasto">🔴 Gasto</option>
                    <option value="inversion">🔵 Inversión</option>
                    <option value="deuda">⚪ Deuda</option>
                </select>
            </div>
            <button onclick="guardar()" class="w-full bg-green-600 hover:bg-green-500 p-4 rounded-xl font-black transition-all active:scale-95 shadow-lg shadow-green-900/20">
                REGISTRAR MOVIMIENTO
            </button>
        </div>

        <div>
            <h2 class="text-slate-400 font-bold mb-4 flex justify-between">
                <span>Historial Reciente</span>
                <button onclick="mostrar()" class="text-xs text-green-500">🔄 Actualizar</button>
            </h2>
            <div id="lista" class="space-y-3">
                </div>
        </div>
    </div>

    <script>
        // CONFIGURACIÓN (Mantén tus llaves reales aquí)
        const SUPABASE_URL = 'https://pibnwghhrnavyzjunkly.supabase.co';
        const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InBpYm53Z2hocm5hdnl6anVua2x5Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzc3MzA4MDIsImV4cCI6MjA5MzMwNjgwMn0.xY0dJ6Zb_4lx0HRJ4YhRV3dLrPzhf9jxUWz6z4izxKI';
        const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        async function mostrar() {
            const { data, error } = await _supabase.from('movimientos').select('*').order('created_at', { ascending: false });
            if (data) {
                const lista = document.getElementById('lista');
                let balanceTotal = 0;

                lista.innerHTML = data.map(d => {
                    const esPositivo = d.tipo === 'ingreso' || d.tipo === 'inversion';
                    balanceTotal += esPositivo ? parseFloat(d.monto) : -parseFloat(d.monto);
                    
                    const colorMonto = esPositivo ? 'text-green-400' : 'text-red-400';
                    const prefijo = esPositivo ? '+' : '-';

                    return `
                        <div class="bg-slate-800 p-4 rounded-xl border border-slate-700 flex justify-between items-center shadow-sm">
                            <div class="flex items-center gap-3">
                                <div class="w-2 h-8 rounded-full ${esPositivo ? 'bg-green-500' : 'bg-red-500'}"></div>
                                <div>
                                    <p class="font-bold text-slate-100">${d.concepto}</p>
                                    <p class="text-[10px] text-slate-500 uppercase font-bold">${d.tipo}</p>
                                </div>
                            </div>
                            <div class="text-right">
                                <p class="font-mono font-black ${colorMonto}">${prefijo}$${parseFloat(d.monto).toLocaleString()}</p>
                                <button onclick="eliminar(${d.id})" class="text-[10px] text-slate-600 hover:text-red-500 transition">ELIMINAR</button>
                            </div>
                        </div>`;
                }).join('');
                
                document.getElementById('balance').innerText = `$${balanceTotal.toLocaleString(undefined, {minimumFractionDigits: 2})}`;
                document.getElementById('balance').className = `text-4xl font-black ${balanceTotal >= 0 ? 'text-green-400' : 'text-red-400'}`;
            }
        }

        async function guardar() {
            const concepto = document.getElementById('desc').value;
            const monto = document.getElementById('val').value;
            const tipo = document.getElementById('tipo').value;
            
            if(!concepto || !monto) return alert('Datos incompletos');

            const { error } = await _supabase.from('movimientos').insert([{ concepto, monto: parseFloat(monto), tipo }]);
            
            if (error) alert('Error: ' + error.message);
            else {
                document.getElementById('desc').value = '';
                document.getElementById('val').value = '';
                mostrar();
            }
        }

        async function eliminar(id) {
            if(confirm('¿Borrar este registro?')) {
                const { error } = await _supabase.from('movimientos').delete().eq('id', id);
                if (error) alert(error.message);
                else mostrar();
            }
        }

        mostrar();
    </script>
</body>
</html>
