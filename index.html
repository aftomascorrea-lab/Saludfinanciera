<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FinanzasPro Cloud - Seguro</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen">

    <div id="auth-section" class="max-w-md mx-auto pt-20 px-4">
        <div class="bg-slate-800 p-8 rounded-3xl border border-slate-700 shadow-2xl text-center">
            <h1 class="text-3xl font-black text-green-400 mb-6">FinanzasPro</h1>
            <p class="text-slate-400 mb-8 text-sm">Ingresa para gestionar tu patrimonio de forma privada.</p>
            <input id="email" type="email" placeholder="Tu correo" class="w-full p-4 rounded-xl bg-slate-900 mb-3 border-none focus:ring-2 focus:ring-green-500">
            <input id="password" type="password" placeholder="Tu contraseña" class="w-full p-4 rounded-xl bg-slate-900 mb-6 border-none focus:ring-2 focus:ring-green-500">
            <div class="grid grid-cols-2 gap-4">
                <button onclick="login()" class="bg-green-600 p-4 rounded-xl font-bold">Entrar</button>
                <button onclick="registro()" class="bg-slate-700 p-4 rounded-xl font-bold">Registrar</button>
            </div>
        </div>
    </div>

    <div id="main-app" class="hidden">
        <div class="bg-slate-800 p-6 shadow-xl sticky top-0 z-10 border-b border-slate-700 flex justify-between items-center">
            <div>
                <h1 id="balance" class="text-3xl font-black text-green-400">$0.00</h1>
                <p class="text-[10px] text-slate-500 font-bold uppercase tracking-widest">Patrimonio Neto</p>
            </div>
            <button onclick="logout()" class="text-xs bg-slate-700 px-3 py-2 rounded-lg text-slate-300">Salir</button>
        </div>

        <div class="max-w-md mx-auto p-4 space-y-6">
            <div class="bg-slate-800 p-5 rounded-2xl border border-slate-700">
                <div class="grid grid-cols-2 gap-3 mb-4">
                    <input id="desc" type="text" placeholder="Concepto" class="col-span-2 p-3 rounded-xl bg-slate-900 border-none">
                    <input id="val" type="number" placeholder="Monto $" class="p-3 rounded-xl bg-slate-900 border-none">
                    <select id="tipo" class="p-3 rounded-xl bg-slate-900 border-none">
                        <option value="ingreso">🟢 Ingreso</option>
                        <option value="gasto">🔴 Gasto</option>
                        <option value="inversion">🔵 Inversión</option>
                        <option value="deuda">⚪ Deuda</option>
                    </select>
                </div>
                <button onclick="guardar()" class="w-full bg-green-600 p-4 rounded-xl font-black">REGISTRAR</button>
            </div>
            <div id="lista" class="space-y-3"></div>
        </div>
    </div>

    <script>
        const SUPABASE_URL = 'https://pibnwghhrnavyzjunkly.supabase.co';
        const SUPABASE_KEY = 'sb_publishable_SlpV8t9zWObDOW6IpVIuDQ_DR3IhD9v';
        const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        // LÓGICA DE AUTENTICACIÓN
        async function registro() {
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const { error } = await _supabase.auth.signUp({ email, password });
            if (error) alert(error.message);
            else alert('¡Revisa tu correo para confirmar tu cuenta!');
        }

        async function login() {
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const { error } = await _supabase.auth.signInWithPassword({ email, password });
            if (error) alert(error.message);
            else checkUser();
        }

        async function logout() {
            await _supabase.auth.signOut();
            checkUser();
        }

        async function checkUser() {
            const { data: { user } } = await _supabase.auth.getUser();
            if (user) {
                document.getElementById('auth-section').classList.add('hidden');
                document.getElementById('main-app').classList.remove('hidden');
                mostrar();
            } else {
                document.getElementById('auth-section').classList.remove('hidden');
                document.getElementById('main-app').classList.add('hidden');
            }
        }

        // LÓGICA DE DATOS (Mantenemos la anterior pero filtrada por usuario)
        async function mostrar() {
            const { data, error } = await _supabase.from('movimientos').select('*').order('created_at', { ascending: false });
            if (data) {
                const lista = document.getElementById('lista');
                let total = 0;
                lista.innerHTML = data.map(d => {
                    const esPositivo = d.tipo === 'ingreso' || d.tipo === 'inversion';
                    total += esPositivo ? parseFloat(d.monto) : -parseFloat(d.monto);
                    return `
                        <div class="bg-slate-800 p-4 rounded-xl border border-slate-700 flex justify-between items-center">
                            <div class="flex items-center gap-3">
                                <div class="w-1 h-6 ${esPositivo ? 'bg-green-500' : 'bg-red-500'}"></div>
                                <div><p class="font-bold">${d.concepto}</p><p class="text-[9px] uppercase">${d.tipo}</p></div>
                            </div>
                            <div class="text-right">
                                <p class="${esPositivo ? 'text-green-400' : 'text-red-400'} font-black">$${d.monto}</p>
                                <button onclick="eliminar(${d.id})" class="text-[9px] text-slate-500">BORRAR</button>
                            </div>
                        </div>`;
                }).join('');
                document.getElementById('balance').innerText = `$${total.toLocaleString()}`;
            }
        }

        async function guardar() {
            const concepto = document.getElementById('desc').value;
            const monto = document.getElementById('val').value;
            const tipo = document.getElementById('tipo').value;
            const { data: { user } } = await _supabase.auth.getUser();
            
            const { error } = await _supabase.from('movimientos').insert([{ concepto, monto: parseFloat(monto), tipo, user_id: user.id }]);
            if (error) alert(error.message);
            else { mostrar(); document.getElementById('desc').value = ''; document.getElementById('val').value = ''; }
        }

        async function eliminar(id) {
            await _supabase.from('movimientos').delete().eq('id', id);
            mostrar();
        }

        checkUser();
    </script>
</body>
</html>
