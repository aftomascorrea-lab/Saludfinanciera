<body class="pb-24">

</main>

            <section class="glass p-6 rounded-[2.5rem] space-y-4">

                <div class="space-y-3">

                    <div class="grid grid-cols-2 gap-3">

        <main id="view-config" class="view space-y-6">

            <div class="glass p-5 rounded-2xl space-y-3">
                <h3 class="text-xs font-bold text-slate-400 uppercase">Gestión de Cuentas</h3>
                <input id="acc-name-config" type="text" placeholder="Nombre Tarjeta/Banco" class="w-full p-3 rounded-lg bg-slate-900 border border-slate-700 text-xs">
                <div class="grid grid-cols-2 gap-2">
                    <select id="acc-type-config" class="p-3 rounded-lg bg-slate-900 border border-slate-700 text-xs">
                        <option value="debito">Débito</option>

                <button onclick="crearCuenta()" class="w-full bg-slate-700 p-2 rounded-lg text-[10px] font-bold">AÑADIR CUENTA</button>
            </div>

            <div class="glass p-5 rounded-2xl space-y-3">
                <h3 class="text-xs font-bold text-slate-400 uppercase">Categorías</h3>
                <div class="flex gap-2">
                    <input id="cat-name" type="text" placeholder="Nueva Categoría" class="flex-1 p-2 bg-slate-700 rouned text-sm">
                    <button onclick="crearCategoria()" class="bg-emerald-600 px-4 rounded-lg font-bold">+</button>

        <nav class="fixed bottom-0 left-0 right-0 glass border-t border-white/10 px-6 py-4 flex justify-between items-center max-w-md mx-auto rounded-t-[2rem] z-50">
            <button onclick="switchView('dashboard')" id="nav-dashboard" class="nav-btn active flex flex-col items-center">
                <span>🏠</span><span class="text-[9px] font-bold">HOME</span>
            </button>
            <button onclick="switchView('movimientos')" id="nav-movimientos" class="nav-btn flex flex-col items-center">
                <span>📜</span><span class="text-[9px] font-bold">HISTORIAL</span>
            </button>
            <button onclick="switchView('config')" id="nav-config" class="nav-btn flex flex-col items-center">
                <span>⚙️</span><span class="text-[9px] font-bold">AJUSTES</span>
            </button>
        </nav>

    <script>
        // --- 1. CONFIGURACIÓN ---
        const SUPABASE_URL = 'https://pibnwghhrnavyzjunkly.supabase.co'; // Corregido
        const SUPABASE_KEY = 'sb_publishable_SlpV8t9zWObDOW6IpVIuDQ_DR3IhD9v';
        const _client = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        // --- 2. NAVEGACIÓN ---
        function switchView(viewId) {
            document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
            document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
            document.getElementById('view-' + viewId).classList.add('active');
            document.getElementById('nav-' + viewId).classList.add('active');
        }

        // --- 3. LÓGICA MSI ---
        async function toggleMSI() {
            const cuentaId = document.getElementById('m-cuenta').value;
            const bloque = document.getElementById('bloque-msi');
            if (cuentaId === 'efectivo') { bloque.classList.add('hidden'); return; }
            const { data: cta } = await _client.from('cuentas').select('tipo').eq('id', cuentaId).single();
            cta?.tipo === 'credito' ? bloque.classList.remove('hidden') : bloque.classList.add('hidden');
        }

 // --- 4. MOTOR DE DATOS ---
async function cargarTodo() {
    const { data: { user } } = await _client.auth.getUser();
    if (!user) return;

    // 1. DESCARGAMOS LOS DATOS (Fíjate en los nombres de la izquierda)
    const { data: cuentas } = await _client.from('Cuentas').select('*');
    const { data: categorias } = await _client.from('Categorias').select('*');
    const { data: movimientos } = await _client.from('Movimientos').select('*').order('created_at', { ascending: false });
          
  // 2. LLAMAMOS a la función del Dashboard pasando los datos que YA descargamos
        actualizarDashboard(movimientos, cuentas, categorias);
        }

        // --- 5. FUNCIONES VISUALES (FUERA DE CARGARTODO) ---
       function actualizarDashboard(movimientos, cuentas, categorias) {
           if (!movimientos || !cuentas) return;

            // Procesamos datos para la gráfica de dona
            const gastosPorCat = {};
            movimientos.forEach(m => {
                if (m.tipo === 'Gasto') {
                    const cat = m.categoria || 'Sin Categoría';
                    gastosPorCat[cat] = (gastosPorCat[cat] || 0) + m.monto;
                }
            });

            const labels = Object.keys(gastosPorCat);
            const dataValues = Object.values(gastosPorCat);

            const canvas = document.getElementById('graficaGastos');
            if (!canvas) return; // Seguridad por si no encuentra el elemento

            const ctx = canvas.getContext('2d');
            
            if (window.miGrafica) {
                window.miGrafica.destroy();
            }

            window.miGrafica = new Chart(ctx, {
                type: 'doughnut',
                data: {
                    labels: labels,
                    datasets: [{
                        data: dataValues,
                        backgroundColor: ['#10b981', '#3b82f6', '#f59e0b', '#ef4444', '#8b5cf6', '#06b6d4'],
                        borderWidth: 0,
                        hoverOffset: 10
                    }]
                },
                options: {
                    cutout: '70%',
                    plugins: {
                        legend: {
                            position: 'bottom',
                            labels: { color: '#94a3b8', font: { size: 10 }, usePointStyle: true }
                        }
                    }
                }
            });
        }

            // Rellenar Selects
 function actualizarDashboard(movimientos, cuentas, categorias) {

    // Rellenar Selects
    const $Cuenta = document.getElementById("m-cuenta");

    $Cuenta.innerHTML = `
        <option value="efectivo">💵 Efectivo</option>
    `;

    cuentas?.forEach(c => {
        $Cuenta.innerHTML += `
            <option value="${c.id}">
                ${c.tipo === "credito" ? "💳" : "🏦"}
                ${c.nombre_institucion}
            </option>
        `;
    });
}
            const sCat = document.getElementById('m-categoria');
            const lCat = document.getElementById('lista-categorias');
            sCat.innerHTML = '<option value="general">📁 General</option>';
            lCat.innerHTML = '';
            categorias?.forEach(c => {
                sCat.innerHTML += `<option value="${c.nombre}">${c.nombre}</option>`;
                lCat.innerHTML += `<span class="px-2 py-1 bg-slate-800 rounded-full text-[9px]">${c.nombre}</span>`;
            });

            // Procesar Movimientos y Dashboard
            let ti=0, tg=0, td=0, tinv=0;
            const lMov = document.getElementById('lista-movimientos');
            lMov.innerHTML = '';
            movimientos?.forEach(m => {
                const cuota = m.msi_cuotas > 1 ? (m.monto/m.msi_cuotas) : m.monto;
                if(m.tipo==='ingreso') ti += m.monto;
                else if(m.tipo==='gasto') tg += cuota;
                else if(m.tipo==='deuda') td += cuota;
                else if(m.tipo==='inversion') tinv += cuota;

                lMov.innerHTML += `<div class="glass p-4 rounded-2xl flex justify-between border-l-4 ${m.tipo==='ingreso'?'border-emerald-500':'border-rose-500'}">
                    <div><p class="text-sm font-bold">${m.concepto}</p><p class="text-[9px] text-slate-500">${m.categoria}</p></div>
                    <div class="text-right"><p class="text-sm font-black">$${cuota.toFixed(2)}</p>
                    <button onclick="eliminarMovimiento('${m.id}')" class="text-[8px] text-slate-600 hover:text-rose-500">BORRAR</button></div>
                </div>`;
            });

            document.getElementById('patrimonio-neto').innerText = `$${(ti + tinv - tg - td).toLocaleString()}`;
            
          // // Calendario Pagos
    const lPagos = document.getElementById('lista-pagos-tarjeta');
    lPagos.innerHTML = '';

    cuentas?.filter(cta => cta.tipo === 'credito').forEach(cta => {
        const total = movimientos?.filter(m => m.cuenta_id === cta.id)
                        .reduce((s, m) => s + (m.monto / (m.msi_cuotas || 1)), 0);

        if (total > 0) {
            lPagos.innerHTML += `
                <div class="flex justify-between bg-slate-900/50 p-3 rounded-xl">
                    <p class="font-bold text-xs">${cta.nombre_institucion} (Día ${cta.fecha_pago})</p>
                    <p class="text-rose-400 font-black">$${total.toFixed(2)}</p>
                </div>`;
}
    });

// --- 5. ACCIONES REFORZADAS ---

async function guardarMovimiento() {
    const { data: { user } } = await _client.auth.getUser();
    if (!user) return alert("Debes estar logueado para registrar datos.");

    const concepto = document.getElementById('m-concepto').value;
    const monto = parseFloat(document.getElementById('m-monto').value);
    const tipo = document.getElementById('m-tipo').value;
    const cuenta = document.getElementById('m-cuenta').value;
    const categoria = document.getElementById('m-categoria').value;
    const msi = parseInt(document.getElementById('m-msi')?.value) || 1;

    if (!concepto || isNaN(monto)) return alert("Escribe un concepto y un monto válido.");

    const { error } = await _client.from('movimientos').insert([{
        user_id: user.id,
        concepto: concepto,
        monto: monto,
        tipo: tipo,
        cuenta_id: cuenta === 'efectivo' ? null : cuenta,
        categoria: categoria,
        msi_cuotas: msi,
        msi_restantes: msi
    }]);

    if (error) alert("Error al guardar: " + error.message);
    else {
        alert("✅ Movimiento registrado");
        document.getElementById('m-concepto').value = '';
        document.getElementById('m-monto').value = '';
        cargarTodo();
    }
}

async function crearCategoria() {
    console.log("Intentando crear categoría..."); // Esto debe salir en consola al dar click
    
    const { data: { user } } = await _client.auth.getUser();
    if (!user) return alert("Error: No hay sesión activa");

    const inputElement = document.getElementById('cat-name');
    if (!inputElement) return alert("Error: No encontré el input 'cat-name' en el HTML");

    const nombreFinal = inputElement.value;
    console.log("Nombre capturado:", nombreFinal);

    if (!nombreFinal) return alert("Escribe un nombre para la categoría");

    // Insertamos asegurando que la tabla es 'categorias' (con S)
    const { data, error } = await _client.from('categorias').insert([
        { nombre: nombreFinal, user_id: user.id }
    ]);

    if (error) {
        console.error("Error de Supabase:", error);
        alert("Error al guardar: " + error.message);
    } else {
        alert("✅ Categoría '" + nombreFinal + "' guardada con éxito");
        inputElement.value = ''; // Limpiamos el campo
        cargarTodo(); // Refrescamos la interfaz
    }
}
async function crearCuenta() {
    const { data: { user } } = await _client.auth.getUser();
    const nombre = document.getElementById('acc-name').value;
    const tipo = document.getElementById('acc-type').value;

    if (!nombre) return alert("Escribe el nombre de la institución.");

    const { error } = await _client.from('cuentas').insert([{ 
        nombre_institucion: nombre, 
        tipo: tipo,
        user_id: user.id 
    }]);

    if (error) alert("Error: " + error.message);
    else {
        alert("✅ Cuenta creada");
        document.getElementById('acc-name').value = '';
        cargarTodo();
    }
}
        // --- 6. AUTH ---
        async function login() { 
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const { error } = await _client.auth.signInWithPassword({ email: email, password: password });
            if(error) alert(error.message);
        }
        async function logout() { await _client.auth.signOut(); location.reload(); }

        _client.auth.onAuthStateChange((event, session) => {
            if (session) {
                document.getElementById('auth-section').classList.add('hidden');
                document.getElementById('main-app').classList.remove('hidden');
                cargarTodo();
            } else {
                document.getElementById('auth-section').classList.remove('hidden');
                document.getElementById('main-app').classList.add('hidden');
            }
        });
    </script>
